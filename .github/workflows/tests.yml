name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  froni-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: froni-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: froni-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
