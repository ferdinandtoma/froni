# Froni app configuration.
# application_url and redirect_urls are placeholders until the hosting decision lands;
# `shopify app dev` rewrites them per run (automatically_update_urls_on_dev = true).

client_id = "91ef1811d3119c40ab480aff3fc66d01"
application_url = "https://example.com"
embedded = true
name = "froni.app"

[build]
dev_store_url = "zkg1yj-ze.myshopify.com"
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[access_scopes]
# Ruled 3 Aug 2026 evening: cap mechanism A, manual close, paid count.
# The pool needs exactly these four.
scopes = "read_products,read_orders,read_inventory,write_inventory"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]
