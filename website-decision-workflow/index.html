<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Froni website decisions</title>
    <link rel="stylesheet" href="/styles.css?v=20260729-7">
  </head>
  <body>
    <noscript>
      <p class="noscript">This private workflow requires JavaScript.</p>
    </noscript>

    <header class="topbar">
      <a class="identity" href="#decision" aria-label="Froni website decision workflow">
        <img src="/brand-wordmark.svg" alt="Froni">
        <span>Website decisions</span>
      </a>

      <div class="topbar-actions">
        <span id="save-state" class="save-state" role="status">Loading</span>
        <span class="local-label">Private local server</span>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" aria-label="Decision roadmap">
        <div class="progress-panel">
          <div class="progress-copy">
            <span>Progress</span>
            <strong id="progress-value">0%</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
          <p id="progress-detail">0 decisions confirmed</p>
        </div>

        <div class="current-rule">
          <span>Working rule</span>
          <strong>One decision at a time</strong>
        </div>

        <nav id="chapter-nav" class="chapter-nav" aria-label="Complete decision map"></nav>
      </aside>

      <main class="main" id="decision">
        <section id="decision-card" class="decision-card" aria-live="polite">
          <div class="loading-panel">Loading the current decision.</div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/roadmap.js"></script>
    <script src="/app.js?v=20260729-7"></script>
  </body>
</html>
